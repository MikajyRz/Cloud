spring.application.name=web
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080

# PostgreSQL Configuration (Docker service)
spring.datasource.url=jdbc:postgresql://db:5432/cloud
spring.datasource.username=cloud
spring.datasource.password=cloud
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

auth.mode=offline
auth.maxLoginAttempts=3
auth.lockMinutes=15
auth.jwt.secret=change-me-in-env
auth.jwt.ttlMinutes=120
auth.manager.email=manager@cloud.local
auth.manager.password=manager123

# Firebase Configuration
firebase.credentials.path=firebase-admin.json
firebase.project.id=ionic-92728

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
